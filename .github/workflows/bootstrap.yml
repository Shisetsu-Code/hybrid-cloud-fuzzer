name: Bootstrap Hybrid Cloud Fuzzer source
on:
  push:
    branches: [main]
    paths:
      - archive/hybrid-release.tar.gz
      - .github/workflows/bootstrap.yml
  workflow_dispatch:
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand source and test
        run: |
          tar -tzf archive/hybrid-release.tar.gz | head -35
          tar -xzf archive/hybrid-release.tar.gz -C .
          mkdir -p docs
          mv .github/workflows/ci.yml docs/ci-template.yml
          npm install --ignore-scripts
          npm run check
          npm test
      - name: Publish source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f archive/hybrid-release.tar.gz
          git add -A
          git commit -m 'feat: materialize multiprovider hybrid controls-first R2/D1 MCP project'
          git push origin HEAD:main
