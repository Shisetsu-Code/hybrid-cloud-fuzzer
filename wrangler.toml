name = "hybrid-cloud-fuzzer"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hybrid-cloud-fuzzer"
database_id = "REPLACE_WITH_D1_DATABASE_UUID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "hybrid-fuzzer-images"
